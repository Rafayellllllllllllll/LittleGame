<html lang="zh-CN">
<head>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#5b2b41}
body{background:radial-gradient(1200px 700px at 20% 15%,#fff0f6 0%,transparent 60%),radial-gradient(1000px 800px at 85% 20%,#ffe9d6 0%,transparent 55%),radial-gradient(900px 700px at 50% 100%,#e9dcff 0%,transparent 60%),linear-gradient(180deg,#fff5f9 0%,#ffe4ef 42%,#ffd9e8 75%,#f3d9ff 100%)}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#scene:active{cursor:grabbing}
.glow{position:fixed;border-radius:50%;filter:blur(40px);opacity:.55;pointer-events:none;z-index:0}
.glow.a{width:42vw;height:42vw;left:-8vw;top:-10vw;background:#ffb7d5}
.glow.b{width:36vw;height:36vw;right:-6vw;top:22vh;background:#ffe9a8}
.glow.c{width:30vw;height:30vw;left:28vw;bottom:-12vw;background:#e6d6ff}
.panel{position:fixed;z-index:10;background:rgba(255,255,255,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9);box-shadow:0 10px 30px rgba(180,80,130,.18);border-radius:18px}
.top{left:12px;top:12px;right:12px;max-width:640px;padding:14px 16px}
.top h1{font-size:20px;letter-spacing:1px}
.top h1 span{font-size:13px;font-weight:400;color:#a86a88;margin-left:6px}
.top p{font-size:13px;line-height:1.6;color:#8a5a73;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12px;padding:5px 9px;border-radius:999px;background:#fff;border:1px solid #ffd0e2}
.chip b{color:#d94f8c}
.status{left:12px;bottom:12px;padding:12px 14px;width:min(360px,calc(100vw - 24px))}
.status .row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
.status .row b{color:#c2357a}
.status .bar{height:8px;background:#ffe0ec;border-radius:99px;overflow:hidden;margin:8px 0 4px}
.status .bar i{display:block;height:100%;background:linear-gradient(90deg,#ff9ec6,#ffb7d5,#ffd166);border-radius:99px;transition:width .25s}
.hint{font-size:12px;line-height:1.6;color:#8a5a73}
.controls{right:12px;bottom:12px;padding:12px;display:flex;flex-direction:column;gap:8px;width:172px}
button{border:0;border-radius:12px;padding:10px 12px;font-size:14px;cursor:pointer;background:#ff7fb0;color:#fff;box-shadow:0 6px 16px rgba(255,127,176,.35)}
button.secondary{background:#fff;color:#c2357a;border:1px solid #ffd0e2;box-shadow:none}
button:active{transform:scale(.98)}
#videoWrap{position:fixed;right:12px;top:12px;z-index:10;width:132px;border-radius:14px;overflow:hidden;border:2px solid rgba(255,255,255,.95);box-shadow:0 10px 26px rgba(0,0,0,.18);background:#000;display:none}
#videoWrap.show{display:block}
#video{width:100%;height:96px;object-fit:cover;transform:scaleX(-1);display:block}
#videoWrap div{font-size:11px;text-align:center;background:rgba(255,255,255,.92);padding:4px}
#toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;background:rgba(60,20,40,.92);color:#fff;padding:14px 18px;border-radius:14px;font-size:14px;line-height:1.6;max-width:min(420px,90vw);text-align:center;display:none}
#togglePanel{position:fixed;right:12px;top:170px;z-index:11;width:44px;height:44px;border-radius:50%;font-size:18px;padding:0}
.hiddenPanel{display:none!important}
@media(max-width:640px){
  .top{padding:11px 13px}.top h1{font-size:17px}.top p{display:none}
  .controls{width:150px;right:10px;bottom:10px}.status{left:10px;bottom:10px}
  #videoWrap{width:104px}#video{height:76px}#togglePanel{top:138px}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>

<body>
<div class="glow a"></div><div class="glow b"></div><div class="glow c"></div>
<canvas id="scene"></canvas>

<div id="videoWrap"><video id="video" playsinline muted autoplay></video><div>前置摄像头预览 · 已镜像</div></div>

<div class="panel top" id="topPanel">
  <h1>🌸 樱花手势 <span>双手开合缩放 · 单手挥动旋转</span></h1>
  <p>一棵大小错落的樱花树：大花在前、小花在后，粉、白、淡紫、杏色、浅金交错，绿叶穿插枝间，花瓣飘落、金蕊闪光。放得越大，细节越多。</p>
  <div class="chips">
    <span class="chip">👐 <b>双手张开</b> 放大</span>
    <span class="chip">✊ <b>双手握拳</b> 缩小</span>
    <span class="chip">👋 <b>单手左右挥</b> 旋转</span>
    <span class="chip">🖱️ <b>无摄像头</b> 拖动 / 滚轮 / 双指</span>

</div>

<div class="panel status" id="statusPanel">
  <div class="row"><span>手势状态</span><b id="gestureText">等待摄像头…</b></div>
  <div class="row"><span>左 / 右手</span><b id="handsText">— / —</b></div>
  <div class="row"><span>缩放 / 细节等级</span><b id="zoomText">100% · LOD 1 标准</b></div>
  <div class="bar"><i id="zoomBar" style="width:38%"></i></div>
  <div class="hint" id="hintText">点右下“开启摄像头”，允许使用前置摄像头后，把双手放进画面。没有摄像头也能直接拖动画面。</div>
</div>

<div class="panel controls" id="controlPanel">
  <button id="btnCamera">📷 开启摄像头</button>
  <button class="secondary" id="btnDemo">✨ 演示模式：关</button>
  <button class="secondary" id="btnReset">↺ 重置视角</button>
  <button class="secondary" id="btnHide">隐藏面板</button>
</div>
<button id="togglePanel" class="panel" style="display:none">🌸</button>
<div id="toast"></div>

<script type="module">
import * as THREE from 'three';

// ---------- 自适应 ----------
const isMobile = matchMedia('(pointer: coarse)').matches || innerWidth < 768;
const isSmallScreen = innerWidth < 640;
const FLOWER_COUNT = isMobile ? 96 : 178;
const FALLING_COUNT = isMobile ? 90 : 220;
const SPARKLE_COUNT = isMobile ? 380 : 950;
const GOLD_COUNT = isMobile ? 120 : 320;
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({canvas, antialias:!isMobile, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.75 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = false;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xffe9f2, 0.011);
const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 0.1, 200);
function baseDist(){ const a = innerWidth/innerHeight; return a < 0.75 ? 36 : a < 1.1 ? 30 : 26; }
let targetZoom = 1.0, currentZoom = 1.0;
const MIN_ZOOM = 0.55, MAX_ZOOM = 2.4;
camera.position.set(0, 2.2, baseDist());

scene.add(new THREE.AmbientLight(0xfff2f7, 1.15));
const sun = new THREE.DirectionalLight(0xfff0d0, 1.6); sun.position.set(8, 14, 10); scene.add(sun);
const pinkLight = new THREE.PointLight(0xff9ec6, 22, 40); pinkLight.position.set(-6, 4, 8); scene.add(pinkLight);
const goldLight = new THREE.PointLight(0xffd166, 14, 30); goldLight.position.set(6, -2, 6); scene.add(goldLight);

// ---------- 贴图：柔光点 ----------
function glowTexture(inner='rgba(255,255,255,1)', outer='rgba(255,180,210,0)'){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'); const gr = g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0, inner); gr.addColorStop(0.4,'rgba(255,200,220,0.7)'); gr.addColorStop(1, outer);
  g.fillStyle = gr; g.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}
const softTex = glowTexture();
// 背景光晕：几个大柔光精灵，营造梦幻氛围
[[ -12,6,-18, 18, 0xffb7d5, .55],[12,8,-18, 15, 0xffe9a8, .5],[0,-6,-20, 22, 0xe6d6ff, .45],[0,10,-16, 10, 0xffffff, .6]].forEach(([x,y,z,s,col,op])=>{
  const m = new THREE.SpriteMaterial({map:softTex, color:col, transparent:true, opacity:op, depthWrite:false});
  const sp = new THREE.Sprite(m); sp.position.set(x,y,z); sp.scale.set(s,s,1); scene.add(sp);
});

// ---------- 几何：花瓣与叶片 ----------
function petalGeometry(){
  const s = new THREE.Shape();
  s.moveTo(0, 0);
  s.bezierCurveTo(-0.42, 0.18, -0.52, 0.62, -0.22, 0.98);
  s.bezierCurveTo(-0.08, 1.12, 0.08, 1.12, 0.22, 0.98);
  s.bezierCurveTo(0.52, 0.62, 0.42, 0.18, 0, 0);
  const geo = new THREE.ShapeGeometry(s, 14);
  const pos = geo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x = pos.getX(i), y = pos.getY(i);
    // 轻微外翻 + 中心隆起，模拟真实花瓣弧度
    pos.setZ(i, Math.sin(y*1.4)*0.12 + x*x*0.18);
  }
  geo.computeVertexNormals(); return geo;
}
function leafGeometry(){
  const s = new THREE.Shape();
  s.moveTo(0, 0);
  s.bezierCurveTo(-0.34, 0.3, -0.3, 0.8, 0, 1.15);
  s.bezierCurveTo(0.3, 0.8, 0.34, 0.3, 0, 0);
  const geo = new THREE.ShapeGeometry(s, 10);
  const pos = geo.attributes.position;
  for(let i=0;i<pos.count;i++){ pos.setZ(i, Math.abs(pos.getX(i))*0.22); }
  geo.computeVertexNormals(); return geo;
}
const petalGeo = petalGeometry(), leafGeo = leafGeometry();
const petalMats = [
  new THREE.MeshStandardMaterial({color:0xff9ec6, roughness:.55, metalness:0, side:THREE.DoubleSide, emissive:0x401020, emissiveIntensity:.18}),
  new THREE.MeshStandardMaterial({color:0xffb7d5, roughness:.6, side:THREE.DoubleSide, emissive:0x401020, emissiveIntensity:.15}),
  new THREE.MeshStandardMaterial({color:0xffc9dd, roughness:.6, side:THREE.DoubleSide}),
  new THREE.MeshStandardMaterial({color:0xfff5f8, roughness:.65, side:THREE.DoubleSide}),
  new THREE.MeshStandardMaterial({color:0xe6d6ff, roughness:.6, side:THREE.DoubleSide}),
  new THREE.MeshStandardMaterial({color:0xffd9b8, roughness:.6, side:THREE.DoubleSide}),
  new THREE.MeshStandardMaterial({color:0xffe9a8, roughness:.6, side:THREE.DoubleSide}),
];
const leafMats = [0x5da85a, 0x7cc47a, 0x3e8a4f, 0x8fd18a].map(c=>new THREE.MeshStandardMaterial({color:c, roughness:.7, side:THREE.DoubleSide}));
const goldMat = new THREE.MeshStandardMaterial({color:0xffc93c, roughness:.3, metalness:.55, emissive:0x664400, emissiveIntensity:.35});
const stamenGeo = new THREE.SphereGeometry(0.045, 8, 8);
const budGeo = new THREE.SphereGeometry(0.12, 10, 10);
const trunkMat = new THREE.MeshStandardMaterial({color:0x6b4a3a, roughness:.95});
const twigMat = new THREE.MeshStandardMaterial({color:0x7a5646, roughness:.95});

const tree = new THREE.Group(); scene.add(tree);
const branchTips = [], branchMids = [];
function branch(start, dir, len, rad, depth){
  const end = start.clone().add(dir.clone().multiplyScalar(len));
  const mid = start.clone().lerp(end, .5);
  const geo = new THREE.CylinderGeometry(rad*0.62, rad, len, 7);
  const mesh = new THREE.Mesh(geo, depth>1 ? trunkMat : twigMat);
  mesh.position.copy(mid);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
  tree.add(mesh);
  branchMids.push(mid.clone());
  if(depth <= 0){ branchTips.push(end.clone()); return; }
  const n = depth === 3 ? 3 : 2;
  for(let i=0;i<n;i++){
    const nd = dir.clone();
    nd.x += (Math.random()-0.5)*1.15; nd.y += 0.25 + Math.random()*0.5; nd.z += (Math.random()-0.5)*1.15;
    nd.normalize();
    branch(end, nd, len*0.68, rad*0.62, depth-1);
  }
}
branch(new THREE.Vector3(0,-7,0), new THREE.Vector3(0.08,1,0.05), 5.2, 0.55, 3);
branch(new THREE.Vector3(0,-7,0), new THREE.Vector3(-0.55,0.85,0.3), 3.6, 0.38, 2);
branch(new THREE.Vector3(0,-7,0), new THREE.Vector3(0.6,0.8,-0.35), 3.8, 0.38, 2);

// ---------- 花朵、叶片、花蕊 ----------
const stamenGroups = [], innerGroups = [], leafVeins = [], budMeshes = [];
function rand(a,b){ return a + Math.random()*(b-a); }
function pickPos(){
  const r = Math.random();
  let base;
  if(r < 0.58 && branchTips.length) base = branchTips[Math.floor(Math.random()*branchTips.length)];
  else if(r < 0.82 && branchMids.length) base = branchMids[Math.floor(Math.random()*branchMids.length)];
  else base = new THREE.Vector3(rand(-5,5), rand(-1,6), rand(-4,4));
  return base.clone().add(new THREE.Vector3(rand(-1.3,1.3), rand(-1.0,1.2), rand(-1.3,1.3)));
}
function makeLeaf(scale){
  const g = new THREE.Group();
  const m = new THREE.Mesh(leafGeo, leafMats[Math.floor(Math.random()*leafMats.length)]);
  m.scale.setScalar(scale); g.add(m);
  const vein = new THREE.Mesh(new THREE.BoxGeometry(0.025, 0.9*scale, 0.012), new THREE.MeshStandardMaterial({color:0xd8f0c8, roughness:.8}));
  vein.position.set(0, 0.55*scale, 0.06); g.add(vein); vein.visible = false; leafVeins.push(vein);
  return g;
}
function makeFlower(){
  const pos = pickPos();
  const sizeRoll = Math.random();
  const scale = sizeRoll < 0.25 ? rand(1.3,1.7) : sizeRoll < 0.7 ? rand(0.9,1.25) : rand(0.55,0.85);
  const isLarge = scale >= 1.15;
  const g = new THREE.Group(); g.position.copy(pos);
  g.rotation.set(rand(-0.8,0.8), rand(0,Math.PI*2), rand(-0.8,0.8));
  g.scale.setScalar(scale);
  const mat = petalMats[Math.floor(Math.random()*petalMats.length)];
  const petalCount = 5 + (Math.random() < 0.35 ? 1 : 0);
  for(let i=0;i<petalCount;i++){
    const pivot = new THREE.Group(); pivot.rotation.z = (i/petalCount)*Math.PI*2;
    const p = new THREE.Mesh(petalGeo, mat);
    p.rotation.x = -0.55; p.scale.setScalar(rand(0.92,1.08)); pivot.add(p); g.add(pivot);
  }
  const center = new THREE.Mesh(new THREE.SphereGeometry(0.14, 10, 10), new THREE.MeshStandardMaterial({color:0xfff0d6, roughness:.5}));
  center.position.z = 0.08; center.scale.set(1,1,0.6); g.add(center);
  // 金色花蕊：9 颗小金点围成一圈
  const sg = new THREE.Group();
  for(let i=0;i<9;i++){
    const a = (i/9)*Math.PI*2;
    const s = new THREE.Mesh(stamenGeo, goldMat);
    s.position.set(Math.cos(a)*0.22, Math.sin(a)*0.22, 0.14); sg.add(s);
  }
  const pistil = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), new THREE.MeshStandardMaterial({color:0xffe9a8}));
  pistil.position.z = 0.2; sg.add(pistil);
  sg.visible = isLarge; g.add(sg); stamenGroups.push({group:sg, isLarge});
  // 内层小花瓣：放大后才出现，层次更丰富
  const inner = new THREE.Group();
  for(let i=0;i<3;i++){
    const pivot = new THREE.Group(); pivot.rotation.z = (i/3)*Math.PI*2 + 0.5;
    const p = new THREE.Mesh(petalGeo, petalMats[Math.floor(Math.random()*petalMats.length)]);
    p.rotation.x = -0.25; p.scale.setScalar(0.55); pivot.add(p); inner.add(p);
  }
  inner.visible = false; g.add(inner); innerGroups.push(inner);
  tree.add(g);
  // 花旁配叶，枝叶穿插
  if(Math.random() < 0.7){
    const leaf = makeLeaf(rand(0.8,1.25));
    leaf.position.copy(pos).add(new THREE.Vector3(rand(-0.9,0.9), rand(-0.7,0.7), rand(-0.7,0.7)));
    leaf.rotation.set(rand(0,3), rand(0,3), rand(0,3)); tree.add(leaf);
  }
  return g;
}
for(let i=0;i<FLOWER_COUNT;i++) makeFlower();
// 独立叶片簇 + 花苞
for(let i=0;i<(isMobile?42:78);i++){
  const base = branchMids.length ? branchMids[Math.floor(Math.random()*branchMids.length)] : new THREE.Vector3(0,0,0);
  const leaf = makeLeaf(rand(0.7,1.3));
  leaf.position.copy(base).add(new THREE.Vector3(rand(-1.4,1.4), rand(-1,1), rand(-1.4,1.4)));
  leaf.rotation.set(rand(0,3), rand(0,3), rand(0,3)); tree.add(leaf);
}
for(let i=0;i<(isMobile?22:40);i++){
  if(!branchTips.length) break;
  const b = new THREE.Mesh(budGeo, petalMats[Math.floor(Math.random()*3)]);
  b.position.copy(branchTips[Math.floor(Math.random()*branchTips.length)]).add(new THREE.Vector3(rand(-0.5,0.5), rand(-0.3,0.5), rand(-0.5,0.5)));
  b.scale.setScalar(rand(0.7,1.2)); b.visible = false; tree.add(b); budMeshes.push(b);
}

// ---------- 飘落花瓣 ----------
const falling = [];
for(let i=0;i<FALLING_COUNT;i++){
  const m = new THREE.Mesh(petalGeo, petalMats[Math.floor(Math.random()*petalMats.length)]);
  m.position.set(rand(-13,13), rand(-7,11), rand(-8,8));
  m.rotation.set(rand(0,3), rand(0,3), rand(0,3));
  m.scale.setScalar(rand(0.55,1.0));
  m.userData = {speed: rand(0.008,0.028), sway: rand(0.4,1.2), phase: rand(0,Math.PI*2), rx: rand(-0.02,0.02), ry: rand(-0.02,0.02)};
  scene.add(m); falling.push(m);
}
// ---------- 闪烁光点 ----------
function makePoints(count, size, color, radiusMin, radiusMax){
  const pos = new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const r = rand(radiusMin, radiusMax), th = rand(0,Math.PI*2), ph = Math.acos(rand(-1,1));
    pos[i*3] = r*Math.sin(ph)*Math.cos(th); pos[i*3+1] = r*Math.cos(ph)*0.75 + 1; pos[i*3+2] = r*Math.sin(ph)*Math.sin(th);
  }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({size, map:softTex, color, transparent:true, opacity:.85, depthWrite:false, blending:THREE.AdditiveBlending});
  const pts = new THREE.Points(geo, mat); scene.add(pts); return pts;
}
const sparkles = makePoints(SPARKLE_COUNT, 0.22, 0xffffff, 5, 15);
const goldDots = makePoints(GOLD_COUNT, 0.16, 0xffd166, 4, 12);

// ---------- LOD：放大逐级加细节 ----------
let lodLevel = 1;
function updateLOD(){
  const z = currentZoom;
  const level = z < 1.0 ? 0 : z < 1.55 ? 1 : z < 2.0 ? 2 : 3;
  if(level === lodLevel && Math.abs(z - (window.__lastZ||0)) < 0.02) { /* 仍需偶尔刷新 */ }
  lodLevel = level; window.__lastZ = z;
  stamenGroups.forEach(o => { o.group.visible = level >= 2 || (level >= 1 && o.isLarge); });
  innerGroups.forEach(g => { g.visible = level >= 2; });
  leafVeins.forEach(v => { v.visible = level >= 2; });
  budMeshes.forEach(b => { b.visible = level >= 1; });
  const names = ['0 简约','1 标准','2 精细','3 极致细节'];
  document.getElementById('zoomText').textContent = Math.round(z*100) + '% · LOD ' + names[level];
  document.getElementById('zoomBar').style.width = Math.min(100, Math.max(5, ((z-MIN_ZOOM)/(MAX_ZOOM-MIN_ZOOM))*100)) + '%';
}

// ---------- 交互状态 ----------
let rotY = 0, rotX = 0.05, rotVel = 0, dragVel = 0;
let demoMode = false, cameraOn = false;
const gestureText = document.getElementById('gestureText');
const handsText = document.getElementById('handsText');
const hintText = document.getElementById('hintText');
const toastEl = document.getElementById('toast');
function toast(msg, ms=4200){ toastEl.textContent = msg; toastEl.style.display = 'block'; setTimeout(()=>toastEl.style.display='none', ms); }
function setGesture(t){ gestureText.textContent = t; }

// 备用操作：拖动旋转 / 滚轮 / 双指缩放
const pointers = new Map(); let lastPinch = 0;
canvas.addEventListener('pointerdown', e => { pointers.set(e.pointerId, {x:e.clientX, y:e.clientY}); canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => {
  if(!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId); const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pointers.size === 1){ rotY += dx*0.005; rotX = Math.max(-0.45, Math.min(0.6, rotX + dy*0.003)); }
  else if(pointers.size === 2){
    const pts = [...pointers.values()]; const d = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
    if(lastPinch > 0){ targetZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, targetZoom * (d/lastPinch))); }
    lastPinch = d;
  }
});
function endPointer(e){ pointers.delete(e.pointerId); if(pointers.size < 2) lastPinch = 0; }
canvas.addEventListener('pointerup', endPointer); canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e => { e.preventDefault(); targetZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, targetZoom * (e.deltaY > 0 ? 0.92 : 1.09))); }, {passive:false});
document.getElementById('btnReset').onclick = () => { rotY = 0; rotX = 0.05; rotVel = 0; targetZoom = 1; toast('已回到初始视角'); };
document.getElementById('btnHide').onclick = () => {
  ['topPanel','statusPanel','controlPanel'].forEach(id=>document.getElementById(id).classList.add('hiddenPanel'));
  document.getElementById('togglePanel').style.display = 'block';
};
document.getElementById('togglePanel').onclick = () => {
  ['topPanel','statusPanel','controlPanel'].forEach(id=>document.getElementById(id).classList.remove('hiddenPanel'));
  document.getElementById('togglePanel').style.display = 'none';
};
document.getElementById('btnDemo').onclick = (e) => {
  demoMode = !demoMode; e.target.textContent = demoMode ? '✨ 演示模式：开' : '✨ 演示模式：关';
  if(demoMode) setGesture('演示模式：自动缩放 + 缓慢旋转，展示 LOD 变化');
};

// ---------- MediaPipe Hands：双手识别 ----------
const video = document.getElementById('video');
let hands = null, handsBusy = false;
let smoothHandX = null, lastHandX = null, stableGesture = '', stableCount = 0;
function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
function analyseHand(lm){
  const palm = Math.max(0.001, dist(lm[0], lm[9]));
  const tips = [8,12,16,20].map(i=>dist(lm[0], lm[i])/palm);
  const openness = tips.reduce((s,v)=>s+v,0)/tips.length;
  let extended = 0;
  [[8,6],[12,10],[16,14],[20,18]].forEach(([t,p])=>{ if(dist(lm[0], lm[t]) > dist(lm[0], lm[p])*1.12) extended++; });
  if(lm[4] && dist(lm[0], lm[4]) > dist(lm[0], lm[3])*1.05) extended++;
  const state = (openness > 2.0 && extended >= 3) ? '张开' : (openness < 1.62 && extended <= 1) ? '握拳' : '半握';
  // 用户视角的左右：前置画面需镜像，1 - x 才是用户眼中的左右
  const userX = 1 - lm[9].x;
  return {state, openness, userX};
}
function onHandsResults(res){
  const list = res.multiHandLandmarks || [];
  if(!list.length){ handsText.textContent = '— / —'; if(cameraOn && !demoMode) setGesture('画面里没有手 · 请把手放进摄像头'); return; }
  const infos = list.map(analyseHand);
  handsText.textContent = infos.map((o,i)=>'手'+(i+1)+' '+o.state).join(' · ');
  if(list.length >= 2){
    const [a,b] = infos;
    let g = '';
    if(a.state === '张开' && b.state === '张开') g = '放大';
    else if(a.state === '握拳' && b.state === '握拳') g = '缩小';
    if(g){
      if(g === stableGesture) stableCount++; else { stableGesture = g; stableCount = 1; }
      if(stableCount >= 3){
        if(g === '放大'){ targetZoom = Math.min(MAX_ZOOM, targetZoom + 0.022); setGesture('👐 双手张开 · 放大中，细节逐级增加'); }
        else { targetZoom = Math.max(MIN_ZOOM, targetZoom - 0.022); setGesture('✊ 双手合拢 / 握拳 · 缩小中'); }
      }
    } else { stableGesture = ''; stableCount = 0; }
    smoothHandX = null;
  } else if(list.length === 1){
    const info = infos[0];
    if(smoothHandX === null){ smoothHandX = info.userX; lastHandX = info.userX; }
    else {
      smoothHandX += (info.userX - smoothHandX)*0.35;
      const dx = smoothHandX - lastHandX; lastHandX = smoothHandX;
      if(Math.abs(dx) > 0.003){
        // 手向右挥，画面向右转；带惯性，松手后会继续滑一小段再停下
        rotVel += -dx * 2.2;
        setGesture(dx > 0 ? '👋 单手向右挥 · 画面向右转' : '👋 单手向左挥 · 画面向左转');
      }
    }
    stableGesture = ''; stableCount = 0;
  }
}
async function startCamera(){
  if(!window.Hands){ toast('手势识别库加载失败，请检查网络后刷新；仍可用拖动 / 滚轮操作。'); return; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user', width:{ideal:1280}, height:{ideal:720}}, audio:false});
    video.srcObject = stream; await video.play();
    document.getElementById('videoWrap').classList.add('show');
    cameraOn = true; hintText.textContent = '摄像头已开启：双手张开放大、双手握拳缩小、单手左右挥动旋转。';
    document.getElementById('btnCamera').textContent = '📷 摄像头已开启';
    if(!hands){
      hands = new window.Hands({locateFile: f => 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/' + f});
      hands.setOptions({maxNumHands:2, modelComplexity: isMobile?0:1, minDetectionConfidence:0.65, minTrackingConfidence:0.6});
      hands.onResults(onHandsResults);
    }
    const loop = async () => {
      if(cameraOn && video.readyState >= 2 && !handsBusy){
        handsBusy = true;
        try{ await hands.send({image: video}); }catch(err){ /* 下一帧重试 */ }
        handsBusy = false;
      }
      requestAnimationFrame(loop);
    };
    loop();
  }catch(err){
    cameraOn = false;
    const msg = (err && err.name === 'NotAllowedError') ? '摄像头未授权：请在浏览器地址栏允许摄像头，或直接用拖动 / 滚轮 / 双指操作，也可点“演示模式”。' : '没有找到可用摄像头或当前不是 https 环境：请用 GitHub Pages 的 https 地址打开，或直接用拖动 / 滚轮 / 双指操作。';
    toast(msg, 6000); hintText.textContent = msg; setGesture('无摄像头 · 已切换为手动操作');
  }
}
document.getElementById('btnCamera').onclick = startCamera;

// ---------- 动画 ----------
const clock = new THREE.Clock();
let hudTick = 0;
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  // 演示模式：自动呼吸式缩放 + 缓慢旋转，方便无摄像头时看到 LOD
  if(demoMode && !cameraOn){
    targetZoom = 1.35 + Math.sin(t*0.45)*0.65;
    rotVel += Math.sin(t*0.3)*0.0006;
  }
  // 平滑过渡：缩放插值 + 旋转惯性衰减，避免抖动
  currentZoom += (targetZoom - currentZoom)*0.075;
  rotVel *= 0.94; rotY += rotVel;
  tree.rotation.y = rotY; tree.rotation.x = rotX;
  tree.position.y = Math.sin(t*0.5)*0.08;
  camera.position.z = baseDist()/currentZoom;
  camera.position.y = 2.2; camera.lookAt(0, 0.8, 0);
  // 飘落花瓣
  falling.forEach(m => {
    const u = m.userData;
    m.position.y -= u.speed; m.position.x += Math.sin(t*u.sway + u.phase)*0.012;
    m.rotation.x += u.rx; m.rotation.y += u.ry;
    if(m.position.y < -7.5){ m.position.y = 11; m.position.x = rand(-13,13); }
  });
  sparkles.rotation.y = t*0.02; sparkles.material.opacity = 0.6 + Math.sin(t*1.8)*0.25;
  goldDots.rotation.y = -t*0.015; goldDots.material.opacity = 0.55 + Math.sin(t*2.4+1)*0.25;
  if(++hudTick % 12 === 0) updateLOD();
  renderer.render(scene, camera);
}
updateLOD(); animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.75 : 2));
});
</script>
</body>
